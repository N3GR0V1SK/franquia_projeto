<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Relatórios</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="icon" type="image/png" href="img/icon_user.png">
    <style>
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .layout-quadrado {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 500px;
        }

        /* Ajustes visuais dos botões */
        .menu {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            background-color: #FFA500; /* Cor laranja */
            color: white; /* Cor do texto branco */
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            font-size: 18px;
        }

        /* Ícones das opções */
        .menu img {
            width: 50px;
            height: 50px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body class="w3-pale-yellow">

<div class="container">
    <h2 class="w3-center w3-text-dark-gray">Menu de Relatórios</h2>
    <div class="layout-quadrado">
        <!-- Contas Pagas -->
        <div class="w3-card w3-hover-shadow menu">
            <a href="relatorios/cPagas.html" class="w3-button w3-block" style="background-color: transparent; color: white;">
                <img src="img/icon_pagas.png" style="width: 120%; height: 120%;" alt="Contas Pagas">
                <p>Contas Pagas</p>
            </a>
        </div>

        <!-- Contas a Pagar -->
        <div class="w3-card w3-hover-shadow menu">
            <a href="relatorios/cPagar.html" class="w3-button w3-block" style="background-color: transparent; color: white;">
                <img src="img/icon_Pagar.png" style="width: 90%; height: 90%;" alt="Contas a Pagar">
                <p>Contas a Pagar</p>
            </a>
        </div>

        <!-- Contas a Receber -->
        <div class="w3-card w3-hover-shadow menu">
            <a href="relatorios/cReceber.html" class="w3-button w3-block" style="background-color: transparent; color: white;">
                <img src="img/icon_receber.png" style="width: 120%; height: 120%;" alt="Contas a Receber">
                <p>Contas a Receber</p>
            </a>
        </div>

        <!-- Relatórios de Vendas -->
        <div class="w3-card w3-hover-shadow menu">
            <a href="relatorios/vendas.html" class="w3-button w3-block" style="background-color: transparent; color: white;">
                <img src="img/Icon_relVendas.png" style="width: 100%; height: 100%;" alt="Relatórios de Vendas">
                <p>Relatórios de Vendas</p>
            </a>
        </div>
    </div>
</div>
<a href="menu.html" class="w3-button w3-orange w3-round btn-voltar w3-text-white" style=" position: fixed; bottom: 20px; right: 20px;">Voltar</a>
</body>
</html>
