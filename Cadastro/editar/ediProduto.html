<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Produto</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="icon" type="image/png" href="img/icon_user.png">
    <style>
        .titulo {
            font-size: 24px;
            font-weight: bold;
            color: white;
        }
        
        .w3-button {
            border: 1px solid #808080;
        }

        .grupo {
            display: inline-block;
            margin-right: 15px;
            width: calc(100% / 3 - 15px);
        }
        
        .w3-input::placeholder {
            color: #ddd;  
        }
    </style>
</head>
<body class="w3-pale-yellow">

<!-- Título -->
<div class="w3-container w3-card w3-round w3-margin w3-padding w3-orange">
    <h2 class="w3-center titulo">Editar Produto</h2>

    <!--Formulário-->
    <div class="w3-margin-top w3-padding">
        <div class="grupo">
            <label class="w3-text-white" for="codigo">Código</label>
            <input type="text" id="codigo" class="w3-input w3-border" placeholder="Código" readonly>
        </div>
        <div class="grupo">
            <label class="w3-text-white" for="descricao">Descrição</label>
            <input type="text" id="descricao" class="w3-input w3-border" placeholder="Descrição">
        </div>
        <div class="grupo">
            <label class="w3-text-white" for="quantidade">Quantidade Estoque</label>
            <input type="number" id="quantidade" class="w3-input w3-border" placeholder="Qtd Estoque">
        </div>
        <div class="grupo">
            <label class="w3-text-white" for="preco">Preço</label>
            <input type="text" id="preco" class="w3-input w3-border" placeholder="Preço">
        </div>
    </div>
    
    <!-- Botões Atualizar e Excluir -->
    <div class="w3-center w3-margin-top">
        <button class="w3-button w3-orange w3-round w3-text-white" onclick="atualizarProduto()">Atualizar</button>
        <button class="w3-button w3-orange w3-round w3-text-white" onclick="excluirProduto()">Excluir</button>
    </div>
</div>

<!-- Botão de Voltar -->
<div style="position: fixed; bottom: 20px; right: 20px;">
    <a href="../produtos.html" class="w3-button w3-orange w3-round w3-text-white" style="margin-right: 10px;">Voltar</a>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    if (id) {
        fetch(`controller/produtos.php?id=${id}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById("codigo").value = data.id;
                document.getElementById("descricao").value = data.descricao;
                document.getElementById("quantidade").value = data.qtdEstoque;
                document.getElementById("preco").value = data.preco;
            });
    }
});

function atualizarProduto() {
    const id = document.getElementById("codigo").value;
    const descricao = document.getElementById("descricao").value;
    const qtdEstoque = document.getElementById("quantidade").value;
    const preco = document.getElementById("preco").value;

    fetch(`controller/produtos.php`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, descricao, qtdEstoque, preco })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert("Produto atualizado com sucesso!");
            window.location.href = "../produtos.html";
        } else {
            alert("Erro ao atualizar produto.");
        }
    });
}

function excluirProduto() {
    const id = document.getElementById("codigo").value;
    if (confirm("Tem certeza que deseja excluir este produto?")) {
        fetch(`controller/produtos.php?id=${id}`, { method: 'DELETE' })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert("Produto excluído com sucesso!");
                window.location.href = "../produtos.html";
            } else {
                alert("Erro ao excluir produto.");
            }
        });
    }
}
</script>

</body>
</html>
