<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cliente</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="icon" type="image/png" href="img/icon_user.png">
    
    <style>
        .Titulo {
            font-size: 24px;
            font-weight: bold;
            color: white;
        }
        
        .w3-button {
            border: 1px solid #808080;
        }

        .grupo {
            display: inline-block;
            margin-right: 15px;
            width: calc(100% / 8 - 15px); 
        }
        
        .w3-input::placeholder {
            color: #ddd;
        }
    </style>
</head>
<body class="w3-pale-yellow">

<!--Titulo-->
<div class="w3-container w3-card w3-round w3-margin w3-padding w3-orange">
    <h2 class="w3-center Titulo">Editar Cliente</h2>

    <!--Formulario-->
    <div class="w3-margin-top w3-padding">
        <div class="grupo">
            <label class="w3-text-white" for="codigo">Código</label>
            <input type="text" id="codigo" class="w3-input w3-border" placeholder="Código" disabled>
        </div>
        <div class="grupo">
            <label class="w3-text-white" for="nome">Nome</label>
            <input type="text" id="nome" class="w3-input w3-border" placeholder="Nome">
        </div>
        <div class="grupo">
            <label class="w3-text-white" for="cpf">CPF</label>
            <input type="text" id="cpf" class="w3-input w3-border" placeholder="CPF">
        </div>
        <div class="grupo">
            <label class="w3-text-white" for="telefone">Telefone</label>
            <input type="text" id="telefone" class="w3-input w3-border" placeholder="Telefone">
        </div>
        <div class="grupo">
            <label class="w3-text-white" for="email">Email</label>
            <input type="email" id="email" class="w3-input w3-border" placeholder="Email">
        </div>
        <div class="grupo">
            <label class="w3-text-white" for="logradouro">Logradouro</label>
            <input type="text" id="logradouro" class="w3-input w3-border" placeholder="Logradouro">
        </div>
        <div class="grupo">
            <label class="w3-text-white" for="numero">Nº</label>
            <input type="text" id="numero" class="w3-input w3-border" placeholder="Nº">
        </div>
        <div class="grupo">
            <label class="w3-text-white" for="bairro">Bairro</label>
            <input type="text" id="bairro" class="w3-input w3-border" placeholder="Bairro">
        </div>
    </div>
    
    <!--Botões-->
    <div class="w3-center w3-margin-top">
        <button class="w3-button w3-orange w3-round w3-text-white" onclick="atualizarCliente()">Atualizar</button>
        <button class="w3-button w3-orange w3-round w3-text-white" onclick="excluirCliente()">Excluir</button>
    </div>
</div>

<!-- Botão de Voltar -->
<div style="position: fixed; bottom: 20px; right: 20px;">
    <a href="../clientes.html" class="w3-button w3-orange w3-round w3-text-white" style="margin-right: 10px;">Voltar</a>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        const clienteId = urlParams.get("id");

        fetch(`controller/clientes.php?id=${clienteId}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById("codigo").value = data.id;
                document.getElementById("nome").value = data.nome;
                document.getElementById("cpf").value = data.cpf;
                document.getElementById("telefone").value = data.telefone;
                document.getElementById("email").value = data.email;
                document.getElementById("logradouro").value = data.logradouro;
                document.getElementById("numero").value = data.numero;
                document.getElementById("bairro").value = data.bairro;
            });
    });

    function atualizarCliente() {
        const cliente = {
            id: document.getElementById("codigo").value,
            nome: document.getElementById("nome").value,
            cpf: document.getElementById("cpf").value,
            telefone: document.getElementById("telefone").value,
            email: document.getElementById("email").value,
            logradouro: document.getElementById("logradouro").value,
            numero: document.getElementById("numero").value,
            bairro: document.getElementById("bairro").value
        };

        fetch('controller/clientes.php', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(cliente)
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert("Cliente atualizado com sucesso!");
                window.location.href = "../clientes.html";
            } else {
                alert("Erro ao atualizar cliente.");
            }
        });
    }

    function excluirCliente() {
        const clienteId = document.getElementById("codigo").value;

        fetch(`controller/clientes.php?id=${clienteId}`, {
            method: 'DELETE'
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert("Cliente excluído com sucesso!");
                window.location.href = "../clientes.html";
            } else {
                alert("Erro ao excluir cliente.");
            }
        });
    }
</script>

</body>
</html>
